<!DOCTYPE html>
<html lang="ko" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HTML 슬라이드 편집기</title>
<meta name="description" content="HTML로 만든 슬라이드와 문서를 브라우저에서 바로 편집하는 도구">
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="css/app.css?v=4.1.1">
<script src="drive-config.js"></script>
</head>
<body>
<div id="app" class="app no-doc">

  <!-- app bar -->
  <header class="appbar">
    <div class="brand" title="HTML 슬라이드 편집기"><span class="brand-mark" data-icon="logo"></span></div>
    <div class="titleblock">
      <div class="title-row">
        <button class="doc-title" id="docTitle"></button>
        <span class="save-state" id="saveState"></span>
      </div>
      <nav class="menubar" id="menubar" aria-label="메뉴"></nav>
    </div>
    <div class="appbar-sp"></div>
    <div class="appbar-actions">
      <button class="btn ghost doc-only" data-cmd="help.keys" data-icon="keyboard" title="단축키"><span class="hide-sm">단축키</span></button>
      <button class="btn secondary doc-only" data-cmd="view.preview" data-icon="present"><span>미리보기</span></button>
      <button class="btn primary doc-only" data-cmd="file.save" data-icon="save"><span id="saveBtnLabel">저장</span></button>
    </div>
  </header>

  <!-- toolbar -->
  <div class="toolbar doc-only" id="toolbar" role="toolbar" aria-label="편집 도구"></div>

  <main class="workspace">
    <!-- left: slides / layers -->
    <aside class="left doc-only" id="left">
      <div class="lp-tabs">
        <button class="lp-tab on deck-only" data-tab="slides"><span data-icon="slides"></span><span>슬라이드</span><span class="count" id="slideCount"></span></button>
        <button class="lp-tab" data-tab="layers"><span data-icon="layers"></span><span>레이어</span></button>
      </div>
      <div class="lp-body">
        <div class="slide-list" id="slideList" tabindex="0" aria-label="슬라이드 목록"></div>
        <div class="slide-list-foot deck-only">
          <button class="btn ghost sm" data-cmd="slide.new" data-icon="plus"><span>새 슬라이드</span></button>
        </div>
        <div class="layer-tree" id="layerTree"></div>
      </div>
    </aside>

    <!-- canvas -->
    <section class="canvas" id="canvas">
      <div class="banners" id="banners"></div>
      <div class="canvas-scroll" id="canvasScroll">
        <div class="canvas-pad">
          <div class="frame-wrap" id="frameWrap">
            <iframe id="view" title="편집 화면" sandbox="allow-scripts" allow="autoplay" referrerpolicy="no-referrer" tabindex="0"></iframe>
            <div class="overlay" id="overlay"></div>
          </div>
        </div>
      </div>
      <div class="canvas-foot doc-only">
        <div class="nav deck-only">
          <button class="icon-btn sm" data-cmd="slide.prev" data-icon="chev-left"></button>
          <span class="nav-info" id="navInfo"></span>
          <button class="icon-btn sm" data-cmd="slide.next" data-icon="chev-right"></button>
        </div>
        <div class="foot-sp"></div>
        <div class="zoom">
          <button class="icon-btn sm" data-cmd="view.zoomOut" data-icon="zoom-out"></button>
          <button class="zoom-label" id="zoomLabel" title="화면에 맞추기">100%</button>
          <button class="icon-btn sm" data-cmd="view.zoomIn" data-icon="zoom-in"></button>
          <button class="icon-btn sm" data-cmd="view.fit" data-icon="fit"></button>
        </div>
      </div>

      <div class="welcome" id="welcome">
        <div class="wl-card">
          <div class="wl-head">
            <span class="wl-mark" data-icon="logo"></span>
            <div>
              <h1>HTML 슬라이드 편집기</h1>
              <p>HTML로 만든 강의 슬라이드와 문서를 브라우저에서 바로 고칩니다. 덱마다 붙어 있는 넘기기·편집 스크립트와 충돌하지 않고, 저장한 파일은 원래 동작을 그대로 지킵니다.</p>
            </div>
          </div>
          <div class="wl-drop" id="welcomeDrop">
            <span data-icon="upload"></span>
            <strong>HTML 파일을 여기에 끌어 놓으세요</strong>
            <span class="wl-drop-sub">또는 아래에서 여는 방법을 고르세요</span>
          </div>
          <div class="wl-actions">
            <button class="btn primary lg" data-cmd="file.open" data-icon="folder-open"><span>파일 열기</span></button>
            <button class="btn secondary lg" data-cmd="file.openDrive" data-icon="cloud"><span>구글 드라이브</span></button>
            <button class="btn secondary lg" data-cmd="file.openUrl" data-icon="globe"><span>웹 주소</span></button>
            <button class="btn secondary lg" data-cmd="file.new" data-icon="file-plus"><span>새 덱 만들기</span></button>
          </div>
          <div class="wl-section">
            <div class="wl-label">최근 파일</div>
            <div class="wl-recent-list" id="welcomeRecent"></div>
          </div>
          <div class="wl-foot">
            <button class="link-btn" data-cmd="help.guide">사용 안내</button>
            <button class="link-btn" data-cmd="help.keys">단축키</button>
            <button class="link-btn" data-cmd="help.legacy">이전 버전(v3)</button>
          </div>
        </div>
      </div>

      <div class="loading" id="loading" hidden>
        <div class="ld-box"><span class="spinner"></span><span class="ld-msg">슬라이드를 분석하는 중…</span></div>
      </div>
      <div class="drop-hint"><span data-icon="upload"></span><span>놓으면 엽니다 (그림은 슬라이드에 넣습니다)</span></div>
    </section>

    <!-- right: inspector -->
    <aside class="right doc-only" id="right">
      <div class="inspector" id="inspector"></div>
    </aside>
  </main>

  <footer class="statusbar">
    <button class="compat-chip doc-only" id="compatChip" title="호환성 정보"></button>
    <span class="status-hint" id="statusHint"></span>
    <span class="status-sp"></span>
    <span class="status-ver">v4.1</span>
  </footer>
</div>

<div id="layer-menus"></div>
<div id="layer-modal"></div>
<div id="toasts" aria-live="polite"></div>
<input type="file" id="fileInput" accept=".html,.htm,text/html" hidden>
<input type="file" id="imageInput" accept="image/*" hidden>

<script src="js/util.js?v=4.1.1"></script>
<script src="js/icons.js?v=4.1.1"></script>
<script src="js/bridge.js?v=4.1.1"></script>
<script src="js/source.js?v=4.1.1"></script>
<script src="js/model.js?v=4.1.1"></script>
<script src="js/view.js?v=4.1.1"></script>
<script src="js/overlay.js?v=4.1.1"></script>
<script src="js/panels.js?v=4.1.1"></script>
<script src="js/inspector.js?v=4.1.1"></script>
<script src="js/insert.js?v=4.1.1"></script>
<script src="js/commands.js?v=4.1.1"></script>
<script src="js/menus.js?v=4.1.1"></script>
<script src="js/io.js?v=4.1.1"></script>
<script src="js/drive.js?v=4.1.1"></script>
<script src="js/present.js?v=4.1.1"></script>
<script src="js/host.js?v=4.1.1"></script>
<script src="js/app.js?v=4.1.1"></script>
</body>
</html>
